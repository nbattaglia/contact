<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f2eb">
    <meta name="description" content="A simple page to connect with Your Name.">
    <title>Your Name — Contact</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #23332d;
        background: #f5f2eb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(ellipse at 15% 15%, rgb(221 231 214 / 75%), transparent 42%),
          radial-gradient(ellipse at 90% 85%, rgb(239 220 195 / 65%), transparent 38%),
          #f5f2eb;
      }

      main {
        width: min(100%, 440px);
        padding: clamp(32px, 8vw, 56px);
        border: 1px solid rgb(35 51 45 / 10%);
        border-radius: 28px;
        background: rgb(255 255 255 / 82%);
        box-shadow: 0 24px 70px rgb(35 51 45 / 9%);
      }

      .eyebrow {
        margin: 0 0 20px;
        color: #718078;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2.6rem, 11vw, 4rem);
        font-weight: 400;
        letter-spacing: -0.06em;
        line-height: 1;
      }

      .intro {
        margin: 18px 0 32px;
        color: #66736c;
        font-size: 1rem;
        line-height: 1.65;
      }

      nav {
        display: grid;
        gap: 10px;
      }

      nav a {
        display: flex;
        min-height: 54px;
        align-items: center;
        justify-content: space-between;
        padding: 0 17px;
        border: 1px solid #e6e9e3;
        border-radius: 13px;
        color: inherit;
        font-size: 0.95rem;
        font-weight: 600;
        text-decoration: none;
        transition: border-color 150ms ease, background 150ms ease, transform 150ms ease;
      }

      nav a:hover {
        transform: translateY(-1px);
        border-color: #b7c8b7;
        background: #f6f8f3;
      }

      nav a:focus-visible {
        outline: 3px solid #739779;
        outline-offset: 3px;
      }

      nav a span:last-child {
        color: #87938b;
        font-size: 1.1rem;
      }

      .vcard {
        margin: 24px 0 0;
        text-align: center;
      }

      .vcard a {
        color: #506b58;
        font-size: 0.9rem;
        font-weight: 600;
        text-underline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Let’s keep in touch</p>
      <h1>Your Name</h1>
      <p class="intro">Find me online or send me a note. I’d love to hear from you.</p>
      <nav aria-label="Contact links">
        <a href="https://www.linkedin.com/in/your-name/"><span>LinkedIn</span><span aria-hidden="true">↗</span></a>
        <a href="https://www.instagram.com/your-name/"><span>Instagram</span><span aria-hidden="true">↗</span></a>
        <a href="mailto:you@example.com"><span>Email</span><span aria-hidden="true">↗</span></a>
      </nav>
      <p class="vcard"><a href="contact.vcf" download>Download my contact card</a></p>
    </main>
  </body>
</html>
